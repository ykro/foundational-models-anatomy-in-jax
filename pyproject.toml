[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "foundational-models-anatomy-in-jax"
version = "0.1.0"
description = "Anatomy of a Foundational Model in JAX: BPE Tokenization, RoPE Self-Attention, Gemma Block (RMSNorm + GQA + GeGLU), KV-Cache, and Autoregressive Sampling Loop for Software Devs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Adrián Catalán"}
]
dependencies = [
  "jax>=0.4.30",
  "jaxlib>=0.4.30",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["N999"]
